<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lily Leap 🐸</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#e8f2df;color:#294b3b;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;padding:20px}.app{width:min(980px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:clamp(30px,5vw,48px)}header p{margin:0 0 12px;color:#688b78}.stats{font-size:20px;font-weight:800;background:#fff9e9;padding:12px 18px;border-radius:24px}.frame{position:relative;border:8px solid #fff9e9;border-radius:24px;overflow:hidden;box-shadow:0 18px 45px #456c5540}canvas{display:block;width:100%;aspect-ratio:16/9;touch-action:none;background:#a6d9d1}.overlay{position:absolute;inset:0;background:#193f39b8;display:grid;place-items:center;padding:20px;text-align:center}.hidden{display:none}.panel{background:#fff9e9;padding:30px;border-radius:22px;max-width:410px}.panel h2{margin:0 0 10px;font-size:34px}.panel p{line-height:1.6}button{background:#f4c777;border:0;border-radius:14px;padding:12px 24px;font:800 18px system-ui;cursor:pointer;color:#36503f;touch-action:none}.help{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:15px;font-weight:700}.controls{display:flex;gap:10px}.controls button{background:#fff9e9;min-width:55px}.sound{font-size:14px;padding:11px 15px;background:#fff9e9}.pause{font-size:14px;padding:11px 15px;background:#fff9e9}.pause:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:700px){
 body{display:block;padding:12px 10px max(14px,env(safe-area-inset-bottom));min-height:100dvh}
 .app{width:100%}
 header{gap:8px;margin-bottom:10px}
 h1{font-size:clamp(25px,7vw,36px)}
 header p{font-size:12px;margin-bottom:0}
 .stats{font-size:15px;padding:9px 12px}
 .frame{border-width:4px;border-radius:16px}
 .panel{padding:18px;max-width:min(340px,94%);border-radius:16px}
 .panel h2{font-size:24px}
 .panel p{font-size:14px;line-height:1.35;margin:8px 0 14px}
 .panel button{font-size:16px;padding:10px 20px}
 .help{display:flex;flex-direction:column;align-items:stretch;gap:9px;margin-top:12px}
 .instructions{font-size:12px;line-height:1.5;text-align:center}
 .controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .controls button{min-width:0;min-height:54px;padding:10px 6px;font-size:15px}
 .controls #jump,.controls #tongue{min-height:70px;font-size:19px;font-weight:900}
 .controls #tongue{grid-column:1;grid-row:1;background:#f4c777}
 .controls #jump{grid-column:2;grid-row:1;background:#b8db9d}
 .controls #pause{grid-column:1;grid-row:2}
 .controls #sound{grid-column:2;grid-row:2}
}
@media(max-width:380px){.stats{font-size:13px}.controls button{font-size:14px}}
@media(orientation:landscape) and (max-height:500px){body{padding:5px 10px}.help{margin-top:5px}.controls button{min-height:45px}.controls #jump,.controls #tongue{min-height:50px}}
</style></head><body><main class="app"><header><div><h1>🐸 Lily Leap</h1><p>a tiny pond adventure</p></div><div class="stats">🪰 <span id="score">0</span> &nbsp; 🏆 <span id="best">0</span></div></header>
<div class="frame"><canvas id="game" width="960" height="540" aria-label="Lily Leap game"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="heading">Ready to leap? 🌿</h2><p id="message">The frog runs automatically! Time your jumps to cross lily pads, catch insects with your tongue, and avoid the water.</p><button id="start">Let's hop! 🐸</button></div></div></div>
<div class="help"><span class="instructions">Auto-run on • Tap game or JUMP to leap • CATCH to grab insects • P / Esc to pause</span><div class="controls"><button id="pause" class="pause" aria-label="Pause game" aria-pressed="false" disabled>⏸ Pause</button><button id="sound" class="sound" aria-label="Toggle sound" aria-pressed="false">🔇 Sound off</button><button id="tongue" aria-label="Catch insect with tongue">👅 Catch</button><button id="jump" aria-label="Jump">JUMP ↑</button></div></div></main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=960,H=540,scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay'),heading=document.querySelector('#heading'),message=document.querySelector('#message'),start=document.querySelector('#start');
let score=0,best=0,state='menu',camera=0,pads=[],flies=[],frog,keys={jump:false},jumpHeld=false,last=0,frame=0,elapsed=0,milestone=0,notice='',particles=[],landedLast=true,soundOn=false,audio=null,tongueTime=0,tongueCooldown=0,tongueTarget=null;
try{best=Number(localStorage.getItem('lilyLeapBest'))||0}catch{}bestEl.textContent=best;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(n,b));
function sound(type){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;o.type=type==='splash'?'triangle':'sine';const tones={jump:[390,580,.15],land:[230,170,.09],fly:[680,1040,.19],tongue:[460,280,.12],splash:[210,75,.35]};const [a,b,d]=tones[type];o.frequency.setValueAtTime(a,now);o.frequency.exponentialRampToValueAtTime(b,now+d);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.065,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+d);o.connect(g).connect(audio.destination);o.start(now);o.stop(now+d+.01);}catch{}}
function burst(x,y,color,count=12){for(let i=0;i<count;i++)particles.push({x,y,vx:rand(-4,4),vy:rand(-6,-1),life:rand(18,42),max:42,color,r:rand(2,5)});}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);circle(p.x-camera,p.y,p.r,p.color);}ctx.globalAlpha=1;}
function difficulty(t){const d=clamp(t/120,0,1);return {speed:2.5+4*d,gap:45+55*d,width:165-55*d,sink:.35*d};}
function nextPad(){const prev=pads[pads.length-1],id=prev.id+1,d=difficulty(elapsed),intro=id<=5;const w=intro?170:rand(d.width*.92,d.width*1.12);const gap=intro?38:rand(d.gap*.75,d.gap*1.1);const y=intro?clamp(prev.y+rand(-20,20),365,435):clamp(prev.y+rand(-Math.min(55,25+elapsed*.25),Math.min(55,25+elapsed*.25)),325,440);const x=prev.x+prev.w+gap;const p={x,y,w,sink:!intro&&Math.random()<d.sink,life:90,id};pads.push(p);if(Math.random()<.85)flies.push({x:x+w/2,y:y-rand(45,65),taken:false,phase:rand(0,7)});return p;}
function createWorld(){pads=[{x:-80,y:435,w:350,sink:false,life:9999,id:0}];flies=[];while(pads[pads.length-1].x+pads[pads.length-1].w<1100)nextPad();}
const pauseBtn=document.querySelector('#pause');
function setPaused(paused){if(paused&&state!=='play'||!paused&&state!=='paused')return;state=paused?'paused':'play';keys.jump=false;jumpHeld=false;pauseBtn.textContent=paused?'▶ Resume':'⏸ Pause';pauseBtn.setAttribute('aria-label',paused?'Resume game':'Pause game');pauseBtn.setAttribute('aria-pressed',String(paused));heading.textContent='Taking a lily break 🌿';message.textContent='Your run is paused. The pond will wait for you!';start.textContent='Resume 🐸';overlay.classList.toggle('hidden',!paused);}
function reset(){score=0;scoreEl.textContent=0;camera=0;frame=0;elapsed=0;milestone=0;notice='Press Space or tap to jump!';particles=[];landedLast=true;keys.jump=false;jumpHeld=false;tongueTime=0;tongueCooldown=0;tongueTarget=null;frog={x:95,y:398,vx:2.5,vy:0,w:36,h:37,grounded:true,on:0,face:1};createWorld();state='play';pauseBtn.disabled=false;pauseBtn.textContent='⏸ Pause';pauseBtn.setAttribute('aria-label','Pause game');pauseBtn.setAttribute('aria-pressed','false');overlay.classList.add('hidden');}
function finish(){if(state!=='play')return;state='over';pauseBtn.disabled=true;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('lilyLeapBest',best)}catch{}}heading.textContent='Splash! 💦';message.textContent='You collected '+score+' points. The pond is waiting for another adventure!';start.textContent='Try again 🐸';burst(frog.x+18,Math.min(H-30,frog.y+30),'#d4f4ec',24);sound('splash');overlay.classList.remove('hidden');}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
function scenery(){
const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#b5dce3');sky.addColorStop(.55,'#e7e9ce');sky.addColorStop(1,'#83bdb1');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
circle(760,105,47,'#fff6d4aa');
function hill(offset,color,height,amp){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+12;x+=12){let world=x+camera*offset;ctx.lineTo(x,height+Math.sin(world/170)*amp+Math.sin(world/65)*amp*.3);}ctx.lineTo(W,H);ctx.fill();}
hill(.08,'#a4c6b3',215,24);hill(.16,'#7ea998',274,28);
for(let i=-2;i<15;i++){let x=i*115-(camera*.24%115),y=260+Math.sin(i*3.3)*22;ctx.strokeStyle='#678f78';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x,y+85);ctx.lineTo(x+8,y-15);ctx.stroke();for(let j=0;j<5;j++)ellipse(x+Math.sin(j*2.4)*25,y-15+j*10,35,20,j%2?'#6f9f7c':'#86b18b');}
const water=ctx.createLinearGradient(0,320,0,H);water.addColorStop(0,'#8dc8bc');water.addColorStop(.6,'#66aea7');water.addColorStop(1,'#3d8e8e');ctx.fillStyle=water;ctx.fillRect(0,320,W,H-320);
ctx.globalAlpha=.19;for(let i=0;i<40;i++){const x=((i*151-camera*.33)%1200+1200)%1200-120,y=345+(i*43%185);ellipse(x,y,30+i%4*11,2,'#eaffde');}ctx.globalAlpha=1;
for(let i=0;i<24;i++){let x=((i*173-camera*.72)%1400+1400)%1400-140;let y=H-15-(i*17%85);ctx.strokeStyle='#477e63';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,H);ctx.quadraticCurveTo(x-12,y+18,x+8,y-20);ctx.stroke();if(i%3===0){ellipse(x+8,y-21,7,18,'#9a845d');ellipse(x+8,y-21,3,12,'#b5a071');}}
for(let i=0;i<17;i++){let x=((i*119-camera*.48)%1200+1200)%1200-100,y=390+(i*41%145);ellipse(x,y,16,5,'#79b79c');if(i%4===0){ctx.strokeStyle='#558e76';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-18);ctx.stroke();circle(x,y-20,6,'#f4c7ce');circle(x+5,y-20,5,'#fff0d7');}}
}function drawPad(p){const x=p.x-camera;if(x+p.w<-60||x>W+60)return;const sub=p.sink?Math.max(0,90-p.life)*.7:0;ellipse(x+p.w/2,p.y+17+sub,p.w*.54,16,'#5eaa98');ellipse(x+p.w/2,p.y+sub,p.w*.52,18,p.sink?'#a0bd69':'#78b777');ellipse(x+p.w/2,p.y-5+sub,p.w*.48,14,p.sink?'#bfd68b':'#9bce88');ctx.fillStyle='#a8dcd2';ctx.beginPath();ctx.moveTo(x+p.w/2,p.y+sub);ctx.lineTo(x+p.w*.81,p.y-16+sub);ctx.lineTo(x+p.w*.83,p.y+3+sub);ctx.closePath();ctx.fill();if(p.sink&&p.life<65){ctx.fillStyle='#fff6db';ctx.font='bold 22px system-ui';ctx.fillText('!',x+p.w/2,p.y-27+sub);}}
function shootTongue(){if(state!=='play'||tongueCooldown>0)return;tongueCooldown=35;tongueTime=15;tongueTarget=null;const mx=frog.x+32,my=frog.y+22;let nearest=Infinity;for(const bug of flies){if(bug.taken)continue;const by=bug.y+Math.sin(frame*.045+bug.phase)*6,dx=bug.x-mx,dy=by-my,dist=Math.hypot(dx,dy);if(dx>=-5&&dx<150&&Math.abs(dy)<75&&dist<nearest){nearest=dist;tongueTarget=bug;}}if(tongueTarget){tongueTarget.taken=true;burst(tongueTarget.x,tongueTarget.y,'#f4e5a5',8);score+=10;scoreEl.textContent=score;sound('fly');}else sound('tongue');}
function drawTongue(){if(tongueTime<=0)return;const progress=1-tongueTime/15,extension=progress<.45?progress/.45:(1-progress)/.55;const sx=frog.x+32-camera,sy=frog.y+22;const tx=tongueTarget?tongueTarget.x-camera:sx+125,ty=tongueTarget?tongueTarget.y+Math.sin(frame*.045+tongueTarget.phase)*6:sy-18;ctx.strokeStyle='#d75f81';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+(tx-sx)*extension,sy+(ty-sy)*extension);ctx.stroke();circle(sx+(tx-sx)*extension,sy+(ty-sy)*extension,5,'#ef93aa');if(tongueTarget){const x=sx+(tx-sx)*extension,y=sy+(ty-sy)*extension;drawBug(x,y,0);}}
function drawBug(x,y,phase){const wing=Math.sin(frame*.55+phase)*4;ellipse(x-6,y-5-wing,7,4,'#edf7eeaa');ellipse(x+6,y-5+wing,7,4,'#edf7eeaa');ellipse(x,y,6,5,'#443c32');circle(x+2,y-1,2,'#e9d88c');}
function drawFrog(){const x=frog.x-camera,y=frog.y;ctx.save();const bob=frog.grounded?Math.sin(frame*.26)*1.6:0;ctx.translate(x+18,y+20+bob);ctx.rotate(frog.grounded?Math.sin(frame*.2)*.035:clamp(frog.vy/90,-.14,.18));ctx.translate(-(x+18),-(y+20));ellipse(x+18,y+35,22,6,'#6aa99b88');ellipse(x+18,y+23,19,17,'#6bbd78');ellipse(x+9,y+9,9,10,'#6bbd78');ellipse(x+28,y+9,9,10,'#6bbd78');circle(x+9,y+8,5,'#fff9e9');circle(x+28,y+8,5,'#fff9e9');circle(x+9+frog.face*1.2,y+8,2.5,'#254b39');circle(x+28+frog.face*1.2,y+8,2.5,'#254b39');circle(x+10,y+23,3,'#ec9f9f');circle(x+27,y+23,3,'#ec9f9f');ctx.strokeStyle='#315c42';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+18,y+22,5,.15,Math.PI-.15);ctx.stroke();ellipse(x+6,y+34,9,4,'#4f9b67');ellipse(x+30,y+34,9,4,'#4f9b67');ctx.restore();}
function update(dt){if(state!=='play')return;frame+=dt;elapsed+=dt/60;tongueCooldown=Math.max(0,tongueCooldown-dt);tongueTime=Math.max(0,tongueTime-dt);if(tongueTime===0)tongueTarget=null;const bottom=frog.y+frog.h;frog.vx=difficulty(elapsed).speed;if(elapsed>=(milestone+1)*30){milestone++;notice=['Pond Explorer!','Lily Hopper!','Pond Champion!','Legendary Leaper!'][Math.min(3,milestone-1)];}if(keys.jump&&!jumpHeld&&frog.grounded){frog.vy=-14.8;frog.grounded=false;frog.on=-1;burst(frog.x+18,frog.y+37,'#b4e6bd',7);sound('jump');}jumpHeld=keys.jump;frog.vy=Math.min(16,frog.vy+.52*dt);frog.x+=frog.vx*dt;frog.y+=frog.vy*dt;frog.grounded=false;for(const p of pads){if(frog.vy>=0&&bottom<=p.y+12&&frog.y+frog.h>=p.y&&frog.x+frog.w>p.x+12&&frog.x<p.x+p.w-12&&(!p.sink||p.life>0)){frog.y=p.y-frog.h;frog.vy=0;frog.grounded=true;frog.on=p.id;break;}}if(frog.grounded&&!landedLast){burst(frog.x+18,frog.y+37,'#e1f3d2',8);sound('land');}landedLast=frog.grounded;const standing=pads.find(p=>p.id===frog.on);if(frog.grounded&&standing?.sink){standing.life-=dt;if(standing.life<=0){frog.grounded=false;frog.vy=1;}}camera=Math.max(0,frog.x-230);while(pads[pads.length-1].x+pads[pads.length-1].w<camera+W+500)nextPad();pads=pads.filter(p=>p.x+p.w>camera-380);flies=flies.filter(f=>f.x>camera-300);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.2*dt;p.life-=dt;}particles=particles.filter(p=>p.life>0);if(frog.y>H+75)finish();}
function render(){scenery();for(const p of pads)drawPad(p);for(const f of flies){if(f.taken)continue;const x=f.x-camera,y=f.y+Math.sin(frame*.045+f.phase)*6;drawBug(x,y,f.phase);}if(frog)drawFrog();if(state==='play'||state==='paused')drawTongue();drawParticles();if(state==='play'&&elapsed<6){ctx.fillStyle='#fff9e9df';ctx.fillRect(330,22,300,38);ctx.fillStyle='#315b47';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText('Space: jump   •   F: catch!',480,47);ctx.textAlign='left';}if(state==='play'&&milestone>0&&elapsed-milestone*30<3){ctx.fillStyle='#fff9e9df';ctx.fillRect(320,65,320,45);ctx.fillStyle='#315b47';ctx.font='bold 21px system-ui';ctx.textAlign='center';ctx.fillText(notice,480,94);ctx.textAlign='left';}}
function tick(t){const dt=Math.min(2,(t-last)/16.667||1);last=t;update(dt);render();requestAnimationFrame(tick);}start.addEventListener('click',()=>{if(state==='paused')setPaused(false);else reset();});pauseBtn.addEventListener('click',()=>setPaused(state==='play'));const tongueButton=document.querySelector('#tongue');tongueButton.addEventListener('pointerdown',e=>{e.preventDefault();shootTongue();});tongueButton.addEventListener('click',e=>{if(e.detail===0)shootTongue();});document.querySelector('#sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 Sound on':'🔇 Sound off';e.currentTarget.setAttribute('aria-pressed',String(soundOn));if(soundOn)sound('fly');});
const mapping={Space:'jump',ArrowUp:'jump',KeyW:'jump'};
window.addEventListener('keydown',e=>{const k=mapping[e.code];if(k){e.preventDefault();keys[k]=true;}if(e.code==='KeyF'||e.code==='KeyX'){e.preventDefault();if(!e.repeat)shootTongue();}if(e.code==='Escape'||e.code==='KeyP'){if(state==='play'||state==='paused'){e.preventDefault();setPaused(state==='play');}}if(e.code==='Enter'&&state==='paused')setPaused(false);else if(e.code==='Enter'&&state!=='play')reset();});window.addEventListener('keyup',e=>{const k=mapping[e.code];if(k){e.preventDefault();keys[k]=false;}});window.addEventListener('blur',()=>{keys={jump:false};jumpHeld=false;if(state==='play')setPaused(true);});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')setPaused(true);});
const jumpButton=document.getElementById('jump');jumpButton.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='play')return;keys.jump=true;try{jumpButton.setPointerCapture(e.pointerId)}catch{}});for(const ev of ['pointerup','pointercancel','lostpointercapture'])jumpButton.addEventListener(ev,()=>{keys.jump=false;});
frog={x:95,y:398,vx:2.7,vy:0,w:36,h:37,grounded:true,on:0,face:1};createWorld();canvas.addEventListener('pointerdown',e=>{if(state==='play'){e.preventDefault();keys.jump=true;try{canvas.setPointerCapture(e.pointerId)}catch{}}});for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,()=>{keys.jump=false;});requestAnimationFrame(tick);
})();
</script></body></html>
