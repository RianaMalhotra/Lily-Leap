<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lily Leap 🐸</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#e8f2df;color:#294b3b;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;padding:20px}.app{width:min(980px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:clamp(30px,5vw,48px)}header p{margin:0 0 12px;color:#688b78}.stats{font-size:20px;font-weight:800;background:#fff9e9;padding:12px 18px;border-radius:24px}.frame{position:relative;border:8px solid #fff9e9;border-radius:24px;overflow:hidden;box-shadow:0 18px 45px #456c5540}canvas{display:block;width:100%;aspect-ratio:16/9;touch-action:none;background:#a6d9d1}.overlay{position:absolute;inset:0;background:#193f39b8;display:grid;place-items:center;padding:20px;text-align:center}.hidden{display:none}.panel{background:#fff9e9;padding:30px;border-radius:22px;max-width:410px}.panel h2{margin:0 0 10px;font-size:34px}.panel p{line-height:1.6}button{background:#f4c777;border:0;border-radius:14px;padding:12px 24px;font:800 18px system-ui;cursor:pointer;color:#36503f;touch-action:none}.help{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:15px;font-weight:700}.controls{display:flex;gap:10px}.controls button{background:#fff9e9;min-width:55px}
</style></head><body><main class="app"><header><div><h1>🐸 Lily Leap</h1><p>a tiny pond adventure</p></div><div class="stats">✨ <span id="score">0</span> &nbsp; 🏆 <span id="best">0</span></div></header>
<div class="frame"><canvas id="game" width="960" height="540" aria-label="Lily Leap game"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="heading">Ready to leap? 🌿</h2><p id="message">Hop from lily pad to lily pad, catch fireflies, and stay out of the water! Watch out for sinking pads.</p><button id="start">Let's hop! 🐸</button></div></div></div>
<div class="help"><span>Move: ← → / A D &nbsp; • &nbsp; Jump: Space / ↑ / W</span><div class="controls"><button id="left" aria-label="Left">←</button><button id="jump" aria-label="Jump">↑</button><button id="right" aria-label="Right">→</button></div></div></main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=960,H=540,scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay'),heading=document.querySelector('#heading'),message=document.querySelector('#message'),start=document.querySelector('#start');
let score=0,best=0,state='menu',camera=0,pads=[],flies=[],frog,keys={left:false,right:false,jump:false},jumpHeld=false,last=0,frame=0;
try{best=Number(localStorage.getItem('lilyLeapBest'))||0}catch{}bestEl.textContent=best;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(n,b));
function createWorld(){pads=[{x:-80,y:435,w:350,sink:false,life:9999,id:0},{x:330,y:410,w:135,sink:false,life:9999,id:1}];flies=[];let end=465,id=1;while(end<2000){const prev=pads[pads.length-1],x=prev.x+prev.w+rand(55,120),y=clamp(prev.y+rand(-75,75),280,450),w=rand(100,160);pads.push({x,y,w,sink:id>1&&Math.random()<.33,life:90,id:++id});if(Math.random()<.8)flies.push({x:x+w/2,y:y-rand(55,95),taken:false,phase:rand(0,7)});end=x+w;}}
function reset(){score=0;scoreEl.textContent=0;camera=0;frame=0;frog={x:95,y:398,vx:0,vy:0,w:36,h:37,grounded:true,on:0,face:1};createWorld();state='play';overlay.classList.add('hidden');}
function finish(){if(state!=='play')return;state='over';if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('lilyLeapBest',best)}catch{}}heading.textContent='Splash! 💦';message.textContent='You collected '+score+' points. The pond is waiting for another adventure!';start.textContent='Try again 🐸';overlay.classList.remove('hidden');}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
function scenery(){ctx.fillStyle='#a8dcd2';ctx.fillRect(0,0,W,H);ctx.fillStyle='#c8ead7';for(let i=0;i<12;i++)ellipse(((i*213-camera*.14)%1200+1200)%1200-120,85+(i%4)*102,95,18,'#d9f1e4');ctx.fillStyle='#8ac8bf';ctx.fillRect(0,472,W,68);for(let i=0;i<22;i++){let x=((i*91-camera*.25)%1100+1100)%1100-50;ctx.strokeStyle='#d2f0df';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,500+(i%3)*15,15,0,Math.PI);ctx.stroke();}}
function drawPad(p){const x=p.x-camera;if(x+p.w<-60||x>W+60)return;const sub=p.sink?Math.max(0,90-p.life)*.7:0;ellipse(x+p.w/2,p.y+17+sub,p.w*.54,16,'#5eaa98');ellipse(x+p.w/2,p.y+sub,p.w*.52,18,p.sink?'#a0bd69':'#78b777');ellipse(x+p.w/2,p.y-5+sub,p.w*.48,14,p.sink?'#bfd68b':'#9bce88');ctx.fillStyle='#a8dcd2';ctx.beginPath();ctx.moveTo(x+p.w/2,p.y+sub);ctx.lineTo(x+p.w*.81,p.y-16+sub);ctx.lineTo(x+p.w*.83,p.y+3+sub);ctx.closePath();ctx.fill();if(p.sink&&p.life<65){ctx.fillStyle='#fff6db';ctx.font='bold 22px system-ui';ctx.fillText('!',x+p.w/2,p.y-27+sub);}}
function drawFrog(){const x=frog.x-camera,y=frog.y;ellipse(x+18,y+35,22,6,'#6aa99b88');ellipse(x+18,y+23,19,17,'#6bbd78');ellipse(x+9,y+9,9,10,'#6bbd78');ellipse(x+28,y+9,9,10,'#6bbd78');circle(x+9,y+8,5,'#fff9e9');circle(x+28,y+8,5,'#fff9e9');circle(x+9+frog.face*1.2,y+8,2.5,'#254b39');circle(x+28+frog.face*1.2,y+8,2.5,'#254b39');circle(x+10,y+23,3,'#ec9f9f');circle(x+27,y+23,3,'#ec9f9f');ctx.strokeStyle='#315c42';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+18,y+22,5,.15,Math.PI-.15);ctx.stroke();ellipse(x+6,y+34,9,4,'#4f9b67');ellipse(x+30,y+34,9,4,'#4f9b67');}
function update(dt){if(state!=='play')return;frame+=dt;const bottom=frog.y+frog.h,dir=Number(keys.right)-Number(keys.left);frog.vx=clamp(frog.vx+(dir*.85-frog.vx*.12)*dt,-5.8,5.8);if(dir)frog.face=dir;if(keys.jump&&!jumpHeld&&frog.grounded){frog.vy=-13.6;frog.grounded=false;frog.on=-1;}jumpHeld=keys.jump;frog.vy=Math.min(16,frog.vy+.52*dt);frog.x+=frog.vx*dt;frog.y+=frog.vy*dt;frog.grounded=false;for(const p of pads){if(frog.vy>=0&&bottom<=p.y+12&&frog.y+frog.h>=p.y&&frog.x+frog.w>p.x+12&&frog.x<p.x+p.w-12&&(!p.sink||p.life>0)){frog.y=p.y-frog.h;frog.vy=0;frog.grounded=true;frog.on=p.id;break;}}const standing=pads.find(p=>p.id===frog.on);if(frog.grounded&&standing?.sink){standing.life-=dt;if(standing.life<=0){frog.grounded=false;frog.vy=1;}}for(const f of flies){if(!f.taken&&Math.hypot(f.x-(frog.x+18),f.y-(frog.y+16))<34){f.taken=true;score+=10;scoreEl.textContent=score;}}camera=Math.max(0,camera+(Math.max(0,frog.x-320-camera))*.12*dt);while(pads[pads.length-1].x+pads[pads.length-1].w<camera+W+500){let prev=pads[pads.length-1],id=prev.id+1,x=prev.x+prev.w+rand(55,125),y=clamp(prev.y+rand(-78,78),275,450),w=rand(95,155);pads.push({x,y,w,sink:Math.random()<.32,life:90,id});if(Math.random()<.85)flies.push({x:x+w/2,y:y-rand(55,95),taken:false,phase:rand(0,7)});}pads=pads.filter(p=>p.x+p.w>camera-380);flies=flies.filter(f=>f.x>camera-300);if(frog.y>H+75||frog.x<camera-100)finish();}
function render(){scenery();for(const p of pads)drawPad(p);for(const f of flies){if(f.taken)continue;const x=f.x-camera,y=f.y+Math.sin(frame*.045+f.phase)*6;circle(x,y,13,'#fff7b266');circle(x,y,5,'#ffe49c');circle(x,y,2,'#fff');}if(frog)drawFrog();}
function tick(t){const dt=Math.min(2,(t-last)/16.667||1);last=t;update(dt);render();requestAnimationFrame(tick);}start.addEventListener('click',reset);
const mapping={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump'};
window.addEventListener('keydown',e=>{const k=mapping[e.code];if(k){e.preventDefault();keys[k]=true;}if(e.code==='Enter'&&state!=='play')reset();});window.addEventListener('keyup',e=>{const k=mapping[e.code];if(k){e.preventDefault();keys[k]=false;}});window.addEventListener('blur',()=>{keys={left:false,right:false,jump:false};jumpHeld=false;});
for(const k of ['left','right','jump']){const b=document.getElementById(k);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId);});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false);}
frog={x:95,y:398,vx:0,vy:0,w:36,h:37,grounded:true,on:0,face:1};createWorld();requestAnimationFrame(tick);
})();
</script></body></html>
